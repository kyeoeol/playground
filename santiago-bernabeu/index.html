<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Santiago Bernabéu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-time="day">
    <canvas id="scene"></canvas>

    <h1 class="title">Santiago Bernabéu</h1>

    <section id="sky-panel" class="panel" aria-label="Today's sky" hidden>
      <header>
        <h2>Today's sky</h2>
        <button id="sky-close" class="plain" type="button" aria-label="Close">✕</button>
      </header>
      <div class="columns">
        <div class="column">
          <h3>Time of day <span id="clock" class="clock"></span></h3>
          <div id="time-icon" class="icon"></div>
          <div class="stepper">
            <button id="time-prev" class="plain" type="button" aria-label="Previous time of day">‹</button>
            <span id="time-label"></span>
            <button id="time-next" class="plain" type="button" aria-label="Next time of day">›</button>
          </div>
          <label class="switch"><span>Follow the day</span><input id="follow-day" type="checkbox" /><i></i></label>
        </div>
        <div class="column">
          <h3>Weather</h3>
          <div id="weather-icon" class="icon"></div>
          <div class="stepper">
            <button id="weather-prev" class="plain" type="button" aria-label="Previous weather">‹</button>
            <span id="weather-label"></span>
            <button id="weather-next" class="plain" type="button" aria-label="Next weather">›</button>
          </div>
          <label class="switch"><span>Auto weather</span><input id="auto-weather" type="checkbox" /><i></i></label>
        </div>
      </div>
      <p class="footnote">A day here lasts 24 minutes.</p>
    </section>

    <button id="sky-toggle" class="sky-toggle" type="button" aria-label="Today's sky" aria-pressed="false"><span id="sky-toggle-icon"></span></button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
